services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: planova
      POSTGRES_USER: planova
      POSTGRES_PASSWORD: ${PLANOVA_POSTGRES_PASSWORD:?set PLANOVA_POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planova -d planova"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - planova-postgres:/var/lib/postgresql/data

  planova:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Planova: Host=postgres;Port=5432;Database=planova;Username=planova;Password=${PLANOVA_POSTGRES_PASSWORD:?set PLANOVA_POSTGRES_PASSWORD in .env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  planova-postgres:
